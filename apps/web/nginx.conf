# =============================================================================
# Nginx config baked into the web production image
# =============================================================================
# THE LISTEN PORT IS 5173 ON PURPOSE, AND IT IS NOT THE VITE DEV SERVER.
#
# This container is only ever reached from inside the compose network, by the
# proxy in infra/nginx/nginx.conf, whose `web_upstream` names `web:5173`. The
# port number is therefore arbitrary — nothing outside the network connects to
# it — and it is matched to the dev server's port so that ONE proxy config
# serves both modes.
#
# The alternative is a separate proxy config per mode, which means two copies
# of the SSE block, the security headers and the CSP, drifting apart the first
# time one of them is edited.
#
# Before "correcting" this to 80: `base.compose.yml + prod.compose.yml` used to
# have exactly that mismatch, and the result was a stack whose API answered
# normally while every page load returned 502.
# =============================================================================

server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # THE THREE FILES THAT MUST NOT BE CACHED (issue #58, epic #33)
    # =========================================================================
    #
    # These come BEFORE the hashed-asset rule below, and the order is the whole
    # point: nginx prefers an exact `location =` match over a regex one, but
    # writing them after would still be a trap for the next reader, who would
    # have to know that rule to see why it works.
    #
    # WHY IT MATTERS. The rule below stamps `Cache-Control: public, immutable`
    # with a one-year expiry, which is correct for `app-a1b2c3.js` — the name
    # changes when the content does, so it can never be wrong. `sw.js`,
    # `index.html` and the manifest are the opposite: their NAMES are stable
    # and their CONTENT changes on every deploy.
    #
    # `sw.js` is the dangerous one. A service worker cached `immutable` for a
    # year pins the user's ENTIRE APP at the version they first installed: the
    # browser never fetches a newer worker, so it never learns about the new
    # precache manifest, so it keeps serving last year's shell — and there is
    # nothing the user can do about it short of clearing site data. Browsers
    # cap worker caching at 24 hours as a backstop, which turns a permanent
    # break into a one-day one; `no-cache` is what makes it zero.
    #
    # A HOST PROXY IN FRONT OF THIS MUST NOT OVERRIDE THESE — see
    # `docs/deployment/vps.md`.

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        # nginx's default mime.types has no entry for `.webmanifest`, so it
        # would be served as `application/octet-stream` — which Chrome refuses
        # to parse as a manifest, making the app silently uninstallable.
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
