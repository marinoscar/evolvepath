name: "Bug report"
description: "Report a defect in existing behavior"
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: |
        What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: |
        Describe the expected outcome.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened instead?
      placeholder: |
        Describe the actual outcome.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part(s) of the system does this affect?
      multiple: true
      options:
        - web
        - api
        - cli
        - docs
        - infra
        - core
        - database
    validations:
      required: true
  - type: textarea
    id: environment-logs
    attributes:
      label: Environment / logs
      description: OS, browser, versions, relevant logs or stack traces.
      placeholder: |
        Paste relevant environment details and/or logs here.
      render: shell
    validations:
      required: false
